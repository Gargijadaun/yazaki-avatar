services:
  - type: web
    name: yazaki-avatar
    env: docker
    plan: standard          # needs at least 2GB RAM for the model
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set this manually in Render dashboard — never commit the value
      - key: PORT
        value: "5001"
      - key: MONGODB_URI
        sync: false          # set this in Render dashboard — MongoDB Atlas connection string
      - key: MONGODB_DB
        value: "yazaki_avatar"  # change if your Atlas user has access to a different DB
    disk:
      name: avatar-uploads
      mountPath: /app/uploads
      sizeGB: 1
